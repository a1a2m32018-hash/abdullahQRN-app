kind = "web"
previewPath = "/"
title = "مصحف آية"
description = "A mobile-first Quran reader with authentic Mushaf page presentation, external Quran API content, Arabic surah index, touch navigation, and persistent bookmarks."
version = "1.0.0"
id = "artifacts/quran-reader"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22460

[services.development]
run = "pnpm --filter @workspace/quran-reader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quran-reader", "run", "build" ]
serve = "static"
publicDir = "artifacts/quran-reader/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22460"
BASE_PATH = "/"
